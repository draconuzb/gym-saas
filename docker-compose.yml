services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gym_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      POSTGRES_DB: gym_system
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./backend/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
      - ./backend/db/03-app-role.sh:/docker-entrypoint-initdb.d/03-app-role.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gym_admin -d gym_system"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-5000}:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: gym_app
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      DB_NAME: gym_system
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://gym.bizdaoson.uz}
      ENABLE_BOTS: ${ENABLE_BOTS:-true}
      ENABLE_WORKER: ${ENABLE_WORKER:-true}
      BOT_USE_WEBHOOK: ${BOT_USE_WEBHOOK:-false}
      WEBHOOK_BASE: ${WEBHOOK_BASE:-}
      PAYME_MERCHANT_ID: ${PAYME_MERCHANT_ID:-}
      PAYME_SECRET_KEY: ${PAYME_SECRET_KEY:-}
      CLICK_SERVICE_ID: ${CLICK_SERVICE_ID:-}
      CLICK_SECRET_KEY: ${CLICK_SECRET_KEY:-}
    volumes:
      - ./kiosk.html:/app/kiosk.html
      - ./telegram-webapp.html:/app/telegram-webapp.html

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ""

volumes:
  pgdata:
